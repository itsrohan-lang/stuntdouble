version: 2
updates:
  # Maintain dependencies for the Go CLI Backend
  - package-ecosystem: "gomod"
    directory: "/cli"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(deps)"

  # Maintain dependencies for the Next.js Web Dashboard
  - package-ecosystem: "npm"
    directory: "/docs"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(deps)"

  # Maintain dependencies for the published NPM CLI wrapper
  - package-ecosystem: "npm"
    directory: "/npm"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(deps)"

  # Maintain dependencies for the VS Code Extension
  - package-ecosystem: "npm"
    directory: "/vscode-extension"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(deps)"

  # Maintain GitHub Actions dependencies
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(deps)"

  # Maintain dependencies for the StuntBot GitHub App
  - package-ecosystem: "npm"
    directory: "/stuntbot"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(deps)"

  # Maintain dependencies for the Control Plane (Go)
  - package-ecosystem: "gomod"
    directory: "/control-plane"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(deps)"

  # Maintain dependencies for the Python SDK
  - package-ecosystem: "pip"
    directory: "/python-sdk"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(deps)"

  # Maintain dependencies for the Kubernetes Operator (Go)
  - package-ecosystem: "gomod"
    directory: "/k8s-operator"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(deps)"

  # Maintain dependencies for the Terraform Provider (Go)
  - package-ecosystem: "gomod"
    directory: "/terraform-provider-stuntdouble"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(deps)"

  # Maintain dependencies for the WebAssembly edge policy engine (Go)
  - package-ecosystem: "gomod"
    directory: "/wasm"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(deps)"

  # Maintain dependencies for the Next.js SOC Dashboard
  - package-ecosystem: "npm"
    directory: "/dashboard"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(deps)"

  # Maintain dependencies for the Electron Desktop App
  - package-ecosystem: "npm"
    directory: "/desktop-app"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(deps)"

  # Maintain dependencies for the Rust eBPF probes
  - package-ecosystem: "cargo"
    directory: "/core-ebpf"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(deps)"
