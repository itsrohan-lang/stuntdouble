name: StuntDouble Safe PR Check

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  agent-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Build Local CLI
        working-directory: ./cli
        run: go build -o /usr/local/bin/sd .

      - name: Verify CLI
        run: sd --help

