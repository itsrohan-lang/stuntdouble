name: CI

# Dependency bumps and pull requests are merged into main, so build and test
# every Go module on each PR. Without this gate a dependabot bump that breaks
# compilation can land unnoticed.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    name: Go build & test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module:
          - cli
          - control-plane
          - k8s-operator
          - terraform-provider-stuntdouble
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: '1.22'
          cache-dependency-path: ${{ matrix.module }}/go.sum

      - name: go build
        working-directory: ${{ matrix.module }}
        run: go build ./...

      - name: go vet
        working-directory: ${{ matrix.module }}
        run: go vet ./...

      - name: go test
        working-directory: ${{ matrix.module }}
        run: go test ./...

  cross-compile:
    name: Cross-compile CLI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: '1.22'
          cache-dependency-path: cli/go.sum

      # The CLI has per-platform enforcement backends behind build tags, so a
      # change to one can break another. Compile all release targets.
      - name: Build all release targets
        working-directory: ./cli
        run: |
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64; do
            echo "==> $target"
            GOOS="${target%/*}" GOARCH="${target#*/}" go build -o /dev/null ./...
          done

  shellcheck:
    name: Shellcheck install.sh
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: shellcheck install.sh
