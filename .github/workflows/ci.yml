name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    name: Go build & test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module:
          - cli
          - control-plane
          - k8s-operator
          - terraform-provider-stuntdouble
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: go build
        working-directory: ${{ matrix.module }}
        run: go build ./...

      - name: go vet
        working-directory: ${{ matrix.module }}
        run: go vet ./...

      - name: go test
        working-directory: ${{ matrix.module }}
        run: go test ./...

  # wasm compiles but ships no tests. Explicitly verify the build rather than
  # running `go test` with no test files, which would pass green misleadingly.
  wasm:
    name: WebAssembly build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: go build (wasm)
        working-directory: wasm
        run: GOOS=js GOARCH=wasm go build -o stuntdouble.wasm .

      - name: go vet (wasm)
        working-directory: wasm
        run: GOOS=js GOARCH=wasm go vet ./...

  cross-compile:
    name: Cross-compile CLI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      # The CLI has per-platform enforcement backends behind build tags, so a
      # change to one can break another. Compile all release targets.
      - name: Build all release targets
        working-directory: ./cli
        run: |
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64; do
            echo "==> $target"
            GOOS="${target%/*}" GOARCH="${target#*/}" go build -o /dev/null ./...
          done

  shellcheck:
    name: Shellcheck install.sh
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: shellcheck install.sh

  # The CLI is the shipped artifact; a build that links but panics on startup
  # is a broken release. stuntdouble-ci.yml previously did only this.
  cli-smoke:
    name: CLI smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Build and run
        working-directory: ./cli
        run: |
          go build -o /usr/local/bin/sd .
          sd --help
          sd version || true

  docs:
    name: Docs site build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: docs/package-lock.json

      - name: npm ci && build
        working-directory: docs
        run: |
          npm ci
          npm run build
