name: Release StuntDouble CLI

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build & Release All
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # Must match the go directive in the module go.mod files (1.25.x) and the
      # version used by ci.yml/test.yml. A lower pin still builds via automatic
      # toolchain download, but silently adds a toolchain fetch to every release.
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Build Binaries
        working-directory: ./cli
        run: |
          GOOS=linux GOARCH=amd64 go build -o stuntdouble-linux-amd64
          GOOS=linux GOARCH=arm64 go build -o stuntdouble-linux-arm64
          GOOS=darwin GOARCH=amd64 go build -o stuntdouble-darwin-amd64
          GOOS=darwin GOARCH=arm64 go build -o stuntdouble-darwin-arm64
          GOOS=windows GOARCH=amd64 go build -o stuntdouble-windows-amd64.exe

      # install.sh refuses to install without a matching checksum, so the
      # release must publish SHA256SUMS alongside the binaries.
      - name: Generate checksums
        working-directory: ./cli
        run: sha256sum stuntdouble-* > SHA256SUMS

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            cli/stuntdouble-*
            cli/SHA256SUMS
          overwrite_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      # Sync package.json version to the git tag (v3.5.0 -> 3.5.0). Without
      # this the version must be manually bumped in two places before each
      # release — once in the git tag and again in package.json. Skip when the
      # version was already bumped in-tree: `npm version` exits non-zero on a
      # no-op, and the publish step below reads the manifest version directly.
      - name: Sync npm version to git tag
        working-directory: ./npm
        run: |
          CURRENT="$(node -p "require('./package.json').version")"
          TARGET="${GITHUB_REF_NAME#v}"
          if [ "$CURRENT" != "$TARGET" ]; then
            npm version --no-git-tag-version "$TARGET"
          fi

      - name: Publish CLI Wrapper to NPM
        working-directory: ./npm
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
