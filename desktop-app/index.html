<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Security-Policy"
          content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src 'self' data:;">
    <title>StuntDouble Desktop</title>
    <style>
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        background-color: #0d1117;
        color: #c9d1d9;
        padding: 40px;
        text-align: center;
      }
      h1 { color: #58a6ff; }
      button {
        background-color: #238636;
        color: white;
        border: none;
        padding: 15px 30px;
        font-size: 16px;
        border-radius: 6px;
        cursor: pointer;
        margin-top: 20px;
      }
      button:hover { background-color: #2ea043; }
      #console {
        margin-top: 30px;
        background: #161b22;
        padding: 20px;
        border-radius: 6px;
        text-align: left;
        font-family: monospace;
        white-space: pre-wrap;
        min-height: 200px;
        color: #3fb950;
      }
    </style>
  </head>
  <body>
    <h1>StuntDouble Sandbox Manager</h1>
    <p>Run your autonomous agents securely without touching the command line.</p>
    
    <div>
      <input type="text" id="agentInput" value="claude" style="padding:10px; font-size:16px;" />
      <button id="startBtn">Launch Secure Sandbox</button>
    </div>

    <div id="console">Ready...</div>

    <script>
      // window.stuntdouble is injected by preload.js via contextBridge. This
      // context has no Node access, so all privileged work goes through it.
      const consoleEl = document.getElementById('console');

      // Agent output is untrusted — it originates from the sandboxed agent.
      // Assign through textContent/innerText only; never innerHTML.
      const append = (text) => { consoleEl.innerText += text; };

      document.getElementById('startBtn').addEventListener('click', () => {
        const agent = document.getElementById('agentInput').value;
        consoleEl.innerText = `Spawning sandbox for ${agent}...\n`;
        window.stuntdouble.startSandbox(agent);
      });

      window.stuntdouble.onOutput(append);
      window.stuntdouble.onStatus((status) => append(`\n${status.output}\n`));
    </script>
  </body>
</html>
